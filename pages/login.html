<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso · Menú Start</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
  </head>
  <body data-page="login" data-guard="public">
    <div class="scanlines"></div>
    <header class="navbar">
      <a class="brand" href="../index.html"><i class="fa-solid fa-shield-halved"></i> SoftArch RPG</a>
      <button class="nav-toggle" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
      <nav class="nav-links">
        <a href="../index.html">Inicio</a>
        <a href="unidades.html">Unidades</a>
        <a class="active" href="login.html">Acceso</a>
      </nav>
    </header>

    <main class="page-wrap">
      <p class="kicker">Menú Start</p>
      <h1>Elige tu héroe</h1>
      <p id="login-status" class="muted">Sin sesión. Elige un héroe con Google o solicita acceso.</p>

      <div class="grid grid-2">
        <section class="form-box pixel-frame">
          <h2>Continuar partida</h2>
          <p class="muted">Inicia sesión con Google para entrar a la base del gremio según tu rango en <code>roles_usuarios</code>.</p>
          <button id="btn-google" class="btn" type="button"><i class="fa-brands fa-google"></i> Login con Google</button>
        </section>

        <section class="form-box pixel-frame">
          <h2>Solicitar acceso al gremio</h2>
          <form id="form-solicitud">
            <label class="field">Nombre
              <input name="nombre" required placeholder="Tu nombre de jugador" />
            </label>
            <label class="field">Correo
              <input name="correo" type="email" required placeholder="correo@universidad.edu" />
            </label>
            <label class="field">Motivo
              <textarea name="motivo" rows="4" required placeholder="¿Por qué debes entrar al editor o al panel?"></textarea>
            </label>
            <button class="btn btn-cyan" type="submit">Enviar solicitud</button>
          </form>
        </section>
      </div>
    </main>

    <footer>Zona de acceso · Firebase Auth</footer>
    <div id="loader" class="loader-overlay"><div class="pixel-loader"></div></div>
    <script type="module" src="../js/navbar.js"></script>
    <script type="module" src="../js/main.js"></script>
  </body>
</html>
